<svg class="viz-root" viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-title diag-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="diag-title">O(N²) vs O(2N-1) 매트릭스 순회 순서 비교 (N=7)</title>
  <desc id="diag-desc">왼쪽: calculate_2d는 이중 for문으로 7×7=49칸 전부를 한 행씩 좌에서 우로 순회한다. 오른쪽: calculate_cross_sparse는 첫 번째 for문에서 중심 행 7칸(1~7)을 좌에서 우로 방문하고, 두 번째 for문으로 넘어가 중심 열의 나머지 6칸(8~13)을 위에서 아래로 방문한다(점선이 두 for문 사이의 전환을 나타낸다). 나머지 36칸은 아예 건드리지 않는다.</desc>

  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--series-1)"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--series-2)"/>
    </marker>
    <marker id="arrowJump" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <style>
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --muted:          #898781;
      --gridline:       #e1e0d9;
      --series-1:       #2a78d6;
      --series-2:       #eb6834;
    }
    @media (prefers-color-scheme: dark) {
      .viz-root {
        color-scheme: dark;
        --surface-1:      #1a1a19;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --muted:          #898781;
        --gridline:       #2c2c2a;
        --series-1:       #3987e5;
        --series-2:       #d95926;
      }
    }
    .bg        { fill: var(--surface-1); }
    .title     { fill: var(--text-primary); font-size: 15px; font-weight: 700; }
    .legend    { fill: var(--text-secondary); font-size: 11px; }
    .caption   { fill: var(--text-secondary); font-size: 11px; }
    .note      { fill: var(--muted); font-size: 10.5px; }
    .cellA     { fill: var(--series-1); fill-opacity: 0.22; stroke: var(--surface-1); stroke-width: 2; }
    .cellB     { fill: var(--surface-1); stroke: var(--gridline); stroke-width: 1; }
    .cellB-hit { fill: var(--series-2); stroke: var(--surface-1); stroke-width: 2; }
    .pathA     { stroke: var(--series-1); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pathB     { stroke: var(--series-2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .jump      { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .stepnum   { fill: var(--text-primary); font-size: 10px; font-weight: 700; }
    .stepnumB  { fill: #ffffff; font-size: 11px; font-weight: 700; }
    .swatch1   { fill: var(--series-1); fill-opacity: 0.4; stroke: var(--gridline); stroke-width: 1; }
    .swatch2   { fill: var(--series-2); stroke: var(--gridline); stroke-width: 1; }
    .swatch3   { fill: var(--surface-1); stroke: var(--gridline); stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="460"/>

