<svg class="viz-root" viewBox="0 0 1080 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="chart-title">O(N²) vs O(2N-1) MAC 연산 벤치마크</title>
  <desc id="chart-desc">왼쪽: 크기 3~800에서 Cross 패턴의 O(N²) dense 연산과 O(2N-1) 희소 연산 시간을 로그 스케일 ms로 비교. 오른쪽: Cross/X 패턴 각각의 개선율(%) 추이. 두 차트 모두 N이 커질수록 O(2N-1)의 이점이 커진다.</desc>

  <style>
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --muted:          #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --series-1:       #2a78d6;
      --series-2:       #eb6834;
      --series-3:       #1baf7a;
    }
    @media (prefers-color-scheme: dark) {
      .viz-root {
        color-scheme: dark;
        --surface-1:      #1a1a19;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --muted:          #898781;
        --gridline:       #2c2c2a;
        --baseline:       #383835;
        --series-1:       #3987e5;
        --series-2:       #d95926;
        --series-3:       #199e70;
      }
    }
    .bg        { fill: var(--surface-1); }
    .title     { fill: var(--text-primary); font-size: 15px; font-weight: 700; }
    .legend    { fill: var(--text-secondary); font-size: 11px; }
    .tick      { fill: var(--muted); font-size: 10px; }
    .axistitle { fill: var(--muted); font-size: 10px; }
    .grid      { stroke: var(--gridline); stroke-width: 1; }
    .base      { stroke: var(--baseline); stroke-width: 1; }
    .leader    { stroke: var(--muted); stroke-width: 1; }
    .line1     { stroke: var(--series-1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .line2     { stroke: var(--series-2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .line3     { stroke: var(--series-3); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dot1      { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
    .dot2      { fill: var(--series-2); stroke: var(--surface-1); stroke-width: 2; }
    .dot3      { fill: var(--series-3); stroke: var(--surface-1); stroke-width: 2; }
    .endlabel  { fill: var(--text-primary); font-size: 11px; font-weight: 600; }
    .swatch1   { stroke: var(--series-1); stroke-width: 2; }
    .swatch2   { stroke: var(--series-2); stroke-width: 2; }
    .swatch3   { stroke: var(--series-3); stroke-width: 2; }
  </style>

  <rect class="bg" x="0" y="0" width="1080" height="500"/>

  <!-- ============ Panel A: 연산 시간 (로그 스케일) ============ -->
  <text class="title" x="30" y="26">연산 시간 비교 (로그 스케일 ms, Cross 패턴)</text>

  <!-- legend -->
  <line class="swatch1" x1="30" y1="46" x2="50" y2="46"/>
  <circle class="dot1" cx="40" cy="46" r="4"/>
  <text class="legend" x="56" y="50">O(N²) 방식 (dense)</text>
  <line class="swatch2" x1="200" y1="46" x2="220" y2="46"/>
  <circle class="dot2" cx="210" cy="46" r="4"/>
  <text class="legend" x="226" y="50">O(2N-1) 방식 (sparse)</text>

  <!-- y gridlines + ticks (100 / 10 / 1 / 0.1 / 0.01 / 0.001 ms) -->
  <line class="grid" x1="90" y1="66" x2="460" y2="66"/>
  <text class="tick" x="84" y="69" text-anchor="end">100ms</text>
  <line class="grid" x1="90" y1="128.8" x2="460" y2="128.8"/>
  <text class="tick" x="84" y="131.8" text-anchor="end">10ms</text>
  <line class="grid" x1="90" y1="191.6" x2="460" y2="191.6"/>
  <text class="tick" x="84" y="194.6" text-anchor="end">1ms</text>
  <line class="grid" x1="90" y1="254.4" x2="460" y2="254.4"/>
  <text class="tick" x="84" y="257.4" text-anchor="end">0.1ms</text>
  <line class="grid" x1="90" y1="317.2" x2="460" y2="317.2"/>
  <text class="tick" x="84" y="320.2" text-anchor="end">0.01ms</text>
  <line class="base" x1="90" y1="380" x2="460" y2="380"/>
  <text class="tick" x="84" y="383" text-anchor="end">0.001ms</text>

  <!-- x category ticks: N = 3,5,13,25,50,100,200,400,800 -->
  <text class="tick" x="90" y="396" text-anchor="middle">3</text>
  <text class="tick" x="136.25" y="396" text-anchor="middle">5</text>
  <text class="tick" x="182.5" y="396" text-anchor="middle">13</text>
  <text class="tick" x="228.75" y="396" text-anchor="middle">25</text>
  <text class="tick" x="275" y="396" text-anchor="middle">50</text>
  <text class="tick" x="321.25" y="396" text-anchor="middle">100</text>
  <text class="tick" x="367.5" y="396" text-anchor="middle">200</text>
  <text class="tick" x="413.75" y="396" text-anchor="middle">400</text>
  <text class="tick" x="460" y="396" text-anchor="middle">800</text>
  <text class="axistitle" x="275" y="412" text-anchor="middle">N (필터/패턴 크기)</text>

  <!-- O(N²) line -->
  <polyline class="line1" points="90,365.53 136.25,348.28 182.5,308.41 228.75,276.06 275,240.67 321.25,204.29 367.5,167.05 413.75,129.68 460,92.06"/>
  <circle class="dot1" cx="90" cy="365.53" r="4"/>
  <circle class="dot1" cx="136.25" cy="348.28" r="4"/>
  <circle class="dot1" cx="182.5" cy="308.41" r="4"/>
  <circle class="dot1" cx="228.75" cy="276.06" r="4"/>
  <circle class="dot1" cx="275" cy="240.67" r="4"/>
  <circle class="dot1" cx="321.25" cy="204.29" r="4"/>
  <circle class="dot1" cx="367.5" cy="167.05" r="4"/>
  <circle class="dot1" cx="413.75" cy="129.68" r="4"/>
  <circle class="dot1" cx="460" cy="92.06" r="4"/>
  <text class="endlabel" x="468" y="96" text-anchor="start">38.46ms</text>

  <!-- O(2N-1) line -->
  <polyline class="line2" points="90,372.85 136.25,362.49 182.5,342.19 228.75,326.54 275,308.61 321.25,290.21 367.5,271.66 413.75,252.28 460,232.85"/>
  <circle class="dot2" cx="90" cy="372.85" r="4"/>
  <circle class="dot2" cx="136.25" cy="362.49" r="4"/>
  <circle class="dot2" cx="182.5" cy="342.19" r="4"/>
  <circle class="dot2" cx="228.75" cy="326.54" r="4"/>
  <circle class="dot2" cx="275" cy="308.61" r="4"/>
  <circle class="dot2" cx="321.25" cy="290.21" r="4"/>
  <circle class="dot2" cx="367.5" cy="271.66" r="4"/>
  <circle class="dot2" cx="413.75" cy="252.28" r="4"/>
  <circle class="dot2" cx="460" cy="232.85" r="4"/>
  <text class="endlabel" x="468" y="236.85" text-anchor="start">0.22ms</text>

  <!-- ============ Panel B: 개선율(%) 추이 ============ -->
  <text class="title" x="530" y="26">개선율(%) 추이 — Cross vs X</text>

  <!-- legend -->
  <line class="swatch1" x1="530" y1="46" x2="550" y2="46"/>
  <circle class="dot1" cx="540" cy="46" r="4"/>
  <text class="legend" x="556" y="50">Cross 패턴</text>
  <line class="swatch3" x1="650" y1="46" x2="670" y2="46"/>
  <circle class="dot3" cx="660" cy="46" r="4"/>
  <text class="legend" x="676" y="50">X 패턴</text>

  <!-- y gridlines + ticks (0/25/50/75/100%) -->
  <line class="grid" x1="590" y1="66" x2="940" y2="66"/>
  <text class="tick" x="584" y="69" text-anchor="end">100%</text>
  <line class="grid" x1="590" y1="144.5" x2="940" y2="144.5"/>
  <text class="tick" x="584" y="147.5" text-anchor="end">75%</text>
  <line class="grid" x1="590" y1="223" x2="940" y2="223"/>
  <text class="tick" x="584" y="226" text-anchor="end">50%</text>
  <line class="grid" x1="590" y1="301.5" x2="940" y2="301.5"/>
  <text class="tick" x="584" y="304.5" text-anchor="end">25%</text>
  <line class="base" x1="590" y1="380" x2="940" y2="380"/>
  <text class="tick" x="584" y="383" text-anchor="end">0%</text>

  <!-- x category ticks -->
  <text class="tick" x="590" y="396" text-anchor="middle">3</text>
  <text class="tick" x="633.75" y="396" text-anchor="middle">5</text>
  <text class="tick" x="677.5" y="396" text-anchor="middle">13</text>
  <text class="tick" x="721.25" y="396" text-anchor="middle">25</text>
  <text class="tick" x="765" y="396" text-anchor="middle">50</text>
  <text class="tick" x="808.75" y="396" text-anchor="middle">100</text>
  <text class="tick" x="852.5" y="396" text-anchor="middle">200</text>
  <text class="tick" x="896.25" y="396" text-anchor="middle">400</text>
  <text class="tick" x="940" y="396" text-anchor="middle">800</text>
  <text class="axistitle" x="765" y="412" text-anchor="middle">N (필터/패턴 크기)</text>

  <!-- Cross improvement line -->
  <polyline class="line1" points="590,304.01 633.75,250.95 677.5,156.75 721.25,115.61 765,92.06 808.75,79.50 852.5,72.91 896.25,69.45 940,67.88"/>
  <circle class="dot1" cx="590" cy="304.01" r="4"/>
  <circle class="dot1" cx="633.75" cy="250.95" r="4"/>
  <circle class="dot1" cx="677.5" cy="156.75" r="4"/>
  <circle class="dot1" cx="721.25" cy="115.61" r="4"/>
  <circle class="dot1" cx="765" cy="92.06" r="4"/>
  <circle class="dot1" cx="808.75" cy="79.50" r="4"/>
  <circle class="dot1" cx="852.5" cy="72.91" r="4"/>
  <circle class="dot1" cx="896.25" cy="69.45" r="4"/>
  <circle class="dot1" cx="940" cy="67.88" r="4"/>

  <!-- X improvement line -->
  <polyline class="line3" points="590,318.46 633.75,267.27 677.5,167.11 721.25,121.26 765,95.52 808.75,81.39 852.5,73.85 896.25,70.08 940,68.20"/>
  <circle class="dot3" cx="590" cy="318.46" r="4"/>
  <circle class="dot3" cx="633.75" cy="267.27" r="4"/>
  <circle class="dot3" cx="677.5" cy="167.11" r="4"/>
  <circle class="dot3" cx="721.25" cy="121.26" r="4"/>
  <circle class="dot3" cx="765" cy="95.52" r="4"/>
  <circle class="dot3" cx="808.75" cy="81.39" r="4"/>
  <circle class="dot3" cx="852.5" cy="73.85" r="4"/>
  <circle class="dot3" cx="896.25" cy="70.08" r="4"/>
  <circle class="dot3" cx="940" cy="68.20" r="4"/>

  <!-- end labels with leader lines (values converge near 99%, so offset + connect) -->
  <line class="leader" x1="942" y1="67.88" x2="952" y2="58"/>
  <circle class="dot1" cx="954" cy="58" r="3"/>
  <text class="endlabel" x="960" y="61.5" text-anchor="start">Cross 99.4%</text>

  <line class="leader" x1="942" y1="68.20" x2="952" y2="84"/>
  <circle class="dot3" cx="954" cy="84" r="3"/>
  <text class="endlabel" x="960" y="87.5" text-anchor="start">X 99.3%</text>
</svg>
