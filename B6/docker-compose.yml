# 과제 실습용 MySQL 8.0
#   켜기   : docker compose up -d
#   끄기   : docker compose down        (데이터도 함께 지워진다)
#   접속   : localhost:3307 / root / codyssey
#
# 컨테이너가 처음 뜰 때 01_schema.sql → 02_data.sql이 자동으로 실행된다.
# 처음 상태로 되돌리려면 down 후 다시 up 하면 된다.
services:
  mysql:
    image: mysql:8.0
    container_name: b6-mysql
    environment:
      MYSQL_ROOT_PASSWORD: codyssey   # 로컬 실습 전용 비밀번호
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3307:3306"         # 맥북에 설치된 MySQL(3306)과 겹치지 않게 3307 사용
    volumes:
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
